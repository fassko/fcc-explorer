<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FCC Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="brand">FCC Explorer</p>
        <h1>Production <em>TEE</em></h1>
        <p class="sub">
          Enter an extension id to open the machine in
          <span class="mono">PRODUCTION</span>, or decode a signed
          <span class="mono">GET /info</span> from a proxy URL.
        </p>
      </header>

      <section class="panel input-panel">
        <div class="modes" role="tablist">
          <button type="button" class="mode" id="mode-extension" aria-pressed="true">
            Extension ID
          </button>
          <button type="button" class="mode" id="mode-fetch" aria-pressed="false">
            Fetch URL
          </button>
          <button type="button" class="mode" id="mode-paste" aria-pressed="false">
            Paste JSON
          </button>
        </div>

        <div id="extension-box">
          <div class="row" style="align-items: flex-end">
            <label class="field">
              Extension ID
              <input
                id="extension-id"
                spellcheck="false"
                inputmode="text"
                placeholder="67278 or 0x106ce"
                autocomplete="off"
              />
            </label>
            <label class="field chain-field">
              Chain
              <select id="chain">
                <option value="114" selected>Coston2</option>
                <option value="16">Coston</option>
              </select>
            </label>
            <button type="button" class="btn" id="find-extension">Find</button>
          </div>
          <p class="presets">
            Preset:
            <button type="button" data-extension="67278" data-chain="114">sandbox · 67278</button>
          </p>
        </div>

        <div id="fetch-box" class="hidden">
          <div class="row" style="align-items: flex-end">
            <label class="field">
              Proxy /info URL
              <input
                id="url"
                spellcheck="false"
                placeholder="https://host:port/info"
              />
            </label>
            <button type="button" class="btn" id="analyze-fetch">Analyze</button>
          </div>
          <p class="presets">
            Presets:
            <button type="button" data-url="http://35.195.12.247:6662/info">sandbox</button>
            ·
            <button type="button" data-url="http://127.0.0.1:52699/info">local proxy</button>
          </p>
        </div>

        <div id="paste-box" class="hidden">
          <label class="field">
            Raw /info JSON
            <textarea
              id="paste"
              spellcheck="false"
              placeholder='{"teeInfo":…,"machineData":…,"dataSignature":…,"attestation":…,"proxySignature":…}'
            ></textarea>
          </label>
          <button type="button" class="btn" id="analyze-paste" style="margin-top: 0.65rem">
            Analyze paste
          </button>
        </div>

        <p class="err hidden" id="error"></p>
      </section>

      <div id="results" class="hidden"></div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
